{% extends 'base.html' %}

{% block title %}Liste des événements{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Liste des événements</h1>
    <div class="row g-4">
        {% for event in events %}
        <div class="col-md-4">
            <div class="card">
                <img src="{{ event.image.url }}" class="card-img-top" alt="{{ event.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ event.title }}</h5>
                    <p class="card-text">{{ event.description|truncatewords:20 }}</p>
                    <p class="text-muted">{{ event.date|date:"d/m/Y" }}</p>
                    <a href="{% url 'event_detail' event_id=event.id %}" class="btn btn-primary">Voir plus</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
