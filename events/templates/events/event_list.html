{% extends 'base.html' %}

{% block title %}Liste des événements{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Liste des événements</h1>
    <div class="row g-4">
        {% for event in events %}
        <div class="col-md-4">
            <a href="{% url 'event_detail' event_id=event.id %}" class="event-card">
                <div class="event-card-image" style="background-image: url('{{ event.image.url }}');">
                    <div class="event-card-overlay">
                        <h5 class="event-card-title">{{ event.title }}</h5>
                        <p class="event-card-date">{{ event.date|date:"d/m/Y" }}</p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
