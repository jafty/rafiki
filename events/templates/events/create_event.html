{% extends 'base.html' %}

{% block title %}Créer un événement{% endblock %}

{% block content %}
<!--====== Start Contact Section ======-->
<section class="contact-section pt-115 pb-100">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="section-title section-title-left mb-50">
                    <h2>Créer un événement</h2>
                </div>
            </div>
        </div>
        <div class="row">

            <div class="col-lg-12">
                <div class="contact-wrapper-one mb-30 wow fadeInRight">
                    <div class="contact-form">
                        <form id="contactForm" enctype="multipart/form-data" name="contactForm" method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="main-btn">Créer</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!--====== End Contact Section ======-->
{% endblock %}
