{% extends 'base.html' %}

{% block title %}Paiement annulé{% endblock %}

{% block content %}
<div class="text-center mt-5">
    <h1 class="text-danger">❌ Paiement annulé</h1>
    <p>Votre paiement a été annulé ou a échoué.</p>
    <p>Vous allez être redirigé vers la liste des événements dans 3 secondes.</p>
</div>

<script>
    setTimeout(function() {
        window.location.href = "{% url 'event_list' %}";
    }, 3000);
</script>
{% endblock %}
