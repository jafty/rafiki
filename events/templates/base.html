{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Application{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="bg-primary text-white py-3">
        <div class="container">
            <h1>{% block header_title %}Bienvenue{% endblock %}</h1>
            <nav class="nav">
                <a class="nav-link text-white" href="/">Accueil</a>
                <a class="nav-link text-white" href="/">Liste des événements</a>
                <a class="nav-link text-white" href="/event/create/">Créer un événement</a>
            </nav>
        </div>
    </header>

    <!-- Main content -->
    <main class="container my-4">
        {% block content %}
        <!-- Contenu spécifique à chaque page -->
        {% endblock %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Déconnexion</button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2024 Mon Application d'Événements</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
